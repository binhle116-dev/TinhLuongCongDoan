<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - Tính lương Công đoạn</title>
<style>
* { box-sizing: border-box; }
:focus-visible { outline: 2px solid #2f7de1; outline-offset: 2px; }
body { font-family: "Segoe UI", Arial, sans-serif; background: #101923; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
.box { background: #fff; padding: 36px 32px; border-radius: 12px; width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background: #2f7de1; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; margin-bottom: 14px; }
.box h1 { font-size: 17px; margin: 0 0 4px; color: #182634; }
.box .sub { font-size: 12.5px; color: #6b7684; margin-bottom: 22px; }
label { display: block; font-size: 13px; color: #6b7684; margin-bottom: 5px; }
input { width: 100%; padding: 9px 10px; margin: 0 0 16px; box-sizing: border-box; border: 1px solid #dde3ea; border-radius: 6px; font-size: 14px; }
input:focus { border-color: #2f7de1; }
button { width: 100%; padding: 10px; background: #2f7de1; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
button:hover { background: #2360b3; }
.errorlist { color: #c53030; font-size: 12.5px; list-style: none; padding: 0; margin: -10px 0 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="brand-mark">BĐ</div>
  <h1>Tính lương Công đoạn</h1>
  <div class="sub">Trung tâm Vận hành - BĐTP Huế</div>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>Tài khoản</label>
    {{ form.username }}
    {{ form.username.errors }}
    <label>Mật khẩu</label>
    {{ form.password }}
    {{ form.password.errors }}
    <button type="submit">Đăng nhập</button>
  </form>
</div>
</body>
</html>
