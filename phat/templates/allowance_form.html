{% extends "base.html" %}
{% block title %}Khoản hỗ trợ{% endblock %}
{% block page_title %}{% if instance %}Sửa khoản hỗ trợ{% else %}Thêm khoản hỗ trợ{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Lưu</button>
  <a class="btn secondary" href="{% url 'allowance_list' %}">Hủy</a>
</form>
</div>
{% endblock %}
